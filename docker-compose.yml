# Autopilot core app — a single container (MariaDB + backend + frontend + nginx,
# run by supervisord). Served at http://<host>/autopilot on port 80.
#
# The host Docker socket is mounted so the backend can spin the pentest-engine
# containers (HexStrike / PentAGI) up and down on demand. Those engines are
# separate stacks (see hexstrike/ and pentagi/), not part of this image.
services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: autopilot-app
    container_name: autopilot
    restart: unless-stopped
    env_file: .env
    environment:
      # DB runs inside this same container.
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      # Engines run as sibling containers on the shared autopilot-net, reached by name.
      HEXSTRIKE_BASE_URL: http://hexstrike:8888
      PENTAGI_BASE_URL: https://pentagi:8443
    networks:
      - autopilot-net
    ports:
      # Host Docker on .70 is rootless and can't bind :80, so publish on a high
      # port. (Set APP_PORT=80 only if the host enables unprivileged port 80.)
      - "${APP_PORT:-8080}:80"
    volumes:
      - autopilot-db-data:/var/lib/mysql
      - ./autopilot_dump.sql:/seed/autopilot_dump.sql:ro
      # Rootless Docker socket on the host (used by the backend to control engines).
      - ${DOCKER_SOCK:-/run/user/1000/docker.sock}:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  autopilot-db-data:

# Shared with the on-demand engine containers (created once on the host:
#   docker network create autopilot-net).
networks:
  autopilot-net:
    external: true
