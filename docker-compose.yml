services:
  backend:
    build: ./backend
    container_name: autopilot-backend
    restart: unless-stopped
    env_file: .env
    environment:
      # DB_HOST points at the persistent MySQL running on the host
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-autopilot}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-autopilot}
      # On-demand pentesting (HexStrike AI). Defaults to the bundled 'hexstrike'
      # service; override in .env to point at an external engine.
      HEXSTRIKE_BASE_URL: ${HEXSTRIKE_BASE_URL:-http://hexstrike:8888}
      PENTEST_ENABLED: ${PENTEST_ENABLED:-false}
      PENTEST_ALLOW_AGGRESSIVE: ${PENTEST_ALLOW_AGGRESSIVE:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8010}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    container_name: autopilot-frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3010}:3000"

  # Optional pentesting engine. Not started by default — bring it up with:
  #   docker compose --profile pentest up -d --build
  # Heavy Kali-based image (see hexstrike/Dockerfile). The backend reaches it at
  # http://hexstrike:8888 on the compose network, so the host port is bound to
  # localhost only — the engine's /api/command runs arbitrary commands and has no
  # auth, so it must NOT be exposed on a public interface.
  hexstrike:
    build: ./hexstrike
    container_name: autopilot-hexstrike
    restart: unless-stopped
    profiles: ["pentest"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HEXSTRIKE_PORT:-8888}:8888"
