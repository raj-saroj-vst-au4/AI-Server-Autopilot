<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d141b"/>
      <stop offset="1" stop-color="#0a1016"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bb8e6"/>
      <stop offset="1" stop-color="#4fd3c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2bb8e6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2bb8e6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="340" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#17242e" stroke-width="1">
    <path d="M0 85H1280M0 170H1280M0 255H1280"/>
    <path d="M160 0V340M320 0V340M480 0V340M640 0V340M800 0V340M960 0V340M1120 0V340"/>
  </g>
  <ellipse cx="930" cy="170" rx="430" ry="260" fill="url(#glow)"/>

  <!-- logo mark -->
  <g transform="translate(74,120)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#111b23" stroke="#223441" stroke-width="2"/>
    <circle cx="48" cy="48" r="27" fill="none" stroke="url(#cyan)" stroke-width="4"/>
    <circle cx="48" cy="48" r="7" fill="#2bb8e6"/>
    <path d="M48 21V8M48 88V75M21 48H8M88 48H75" stroke="#2bb8e6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="48" cy="8" r="4" fill="#17946a"/>
    <circle cx="88" cy="48" r="4" fill="#c68a1c"/>
  </g>

  <!-- wordmark -->
  <text x="208" y="158" font-size="58" font-weight="700" fill="#e7eef3" letter-spacing="-1">AI Server Autopilot</text>
  <text x="210" y="200" font-size="23" fill="#9fb2bd" font-weight="500">Monitor, analyze, automate &amp; pentest your whole fleet — from one pane.</text>

  <!-- chips -->
  <g font-family="'JetBrains Mono',ui-monospace,monospace" font-size="15">
    <g transform="translate(210,232)">
      <rect width="168" height="34" rx="17" fill="#0f1a16" stroke="#1d4035"/>
      <circle cx="20" cy="17" r="5" fill="#17946a"/>
      <text x="36" y="22" fill="#5fcf9f">fleet monitoring</text>
    </g>
    <g transform="translate(390,232)">
      <rect width="150" height="34" rx="17" fill="#121a22" stroke="#1d3a49"/>
      <circle cx="20" cy="17" r="5" fill="#2bb8e6"/>
      <text x="36" y="22" fill="#79cdea">AI analysis</text>
    </g>
    <g transform="translate(552,232)">
      <rect width="196" height="34" rx="17" fill="#121a22" stroke="#1d3a49"/>
      <circle cx="20" cy="17" r="5" fill="#2bb8e6"/>
      <text x="36" y="22" fill="#79cdea">Clawdbot chat-ops</text>
    </g>
    <g transform="translate(760,232)">
      <rect width="232" height="34" rx="17" fill="#1a130f" stroke="#40301d"/>
      <circle cx="20" cy="17" r="5" fill="#c68a1c"/>
      <text x="36" y="22" fill="#e0b063">on-demand pentesting</text>
    </g>
  </g>
</svg>
