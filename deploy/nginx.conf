server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 25m;

    # Bare root -> the app.
    location = / { return 302 /autopilot/; }

    # API: strip the /autopilot prefix and hand to the backend.
    location /autopilot/api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
    }

    # Everything else under /autopilot -> the Next.js server (basePath=/autopilot).
    # No trailing slash so "/autopilot" (no slash) also matches. $http_host keeps
    # the port so Next's redirects don't drop it.
    location /autopilot {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
